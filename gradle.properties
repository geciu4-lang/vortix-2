org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# AGP 9 built-in Kotlin is disabled because this project explicitly pins KGP 2.4.21.
# This keeps the compiler version reproducible until the AGP-bundled compiler is adopted.
android.builtInKotlin=false
# Required while opting out of AGP 9 built-in Kotlin and retaining the external Kotlin Android plugin.
android.newDsl=false
